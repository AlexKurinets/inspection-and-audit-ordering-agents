name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d ops_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ops:ops@localhost:5432/ops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -e ".[dashboard,dev]"
      - run: ruff check src tests dashboard
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, seed and start the stack
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Smoke test every documented command
        run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v
